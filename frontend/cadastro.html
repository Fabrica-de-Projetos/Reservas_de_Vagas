<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadastro.css">
    <title>Tela Cadastro </title>
</head>
<body>
    <main>
        <div class="container">
            <section class="sessao-apresentacao">
                <div class="logo-spot-livre">
                    <img class="logo-dsin" src="img/dsin-logo.png" alt="Dsin Logo">
                    <p class="spot-livre-spot"><b>Spot<span class="spot-livre-livre">livre</span></b></p>
                </div>
                <h1 class="titulo-apresentacao">Seja bem vindo!</h1>
                <h3 class="mensagem-apresentacao">chegou, registrou, estacionou</h3>
            </section>
            <section class="sessao-cadastro">
                <div class="background-card">
                    <div class="input-container">

                        <!--Nome completo-->
                        <label class="input-box">
                            <span class="input-icone">
                                <img src="img/icones/usuario.png" alt="">
                            </span>
                            <input placeholder=" " type="text">
                            <span class="input-descricao">Nome completo</span>
                        </label>

                        <!--Email-->
                        
                        <label class="input-box">
                            <span class="input-icone">
                                <img src="img/icones/email.png" alt="">
                            </span>
                            <input placeholder=" " type="text">
                            <span class="input-descricao">Email</span>
                        </label>

                        <!--Senha-->
                        <label class="input-box">
                            <span class="input-icone">
                                <img src="img/icones/senha.png" alt="">
                            </span>
                            <input placeholder=" " type="text">
                            <span class="input-descricao">Senha</span>
                        </label>

                        <!--Modelo do veículo-->
                        <label class="input-box">
                            <span class="input-icone">
                                <img src="img/icones/carro.png" alt="">
                            </span>
                            <input placeholder=" " type="text">
                            <span class="input-descricao">Modelo do veículo</span>
                        </label>

                        <!--placa do veículo-->
                        <label class="input-box">
                            <span class="input-icone">
                                <img src="img/icones/placa.png" alt="">
                            </span>
                            <input placeholder=" " type="text">
                            <span class="input-descricao">placa do veículo</span>
                        </label>
                        <div class="centralizar">
                            <button style="margin-top: 30px;" class="botao-modelo-principal">Cadastrar</button>
                        </div>
                    </div>
                </div>
            </section>
            <div style="margin-bottom: 30px;" class="centralizar">
                <span style="color: white; margin-right: 5px;">Já possui uma conta?</span>
                <a style="color: #FFCB00; text-decoration: none ;" href="index.html">fazer login</a>
            </div>
        </div>
    </main>
    
</body>
</html>
