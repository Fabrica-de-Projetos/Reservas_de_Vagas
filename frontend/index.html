<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela inicial</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <!-- Logo -->
        <div class="container-header">
            <div class="logo-spot-livre">
                <img class="logo-dsin" src="img/dsin-logo.png" alt="Dsin Logo">
                <p class="spot-livre-spot"><b>Spot<span class="spot-livre-livre">livre</span></b></p>
            </div>
        </div>
    </header>
    <main>
        <div class="container-comeco">
            <aside class="formulario-login-cadastro">
                <div class="spot-livre-frase">
                    <p><b>Mais tempo para seus compromissos, menos tempo no volante.</b></p>
                </div>
                <!-- Botão com as opções de logar ou cadastrar -->
                <div class="container-login-e-registro">
                    <div class="box-botao">
                        <button class="button-garanta-sua-vaga">
                            <b>Garanta a sua vaga!</b>
                        </button>
                        <div class="login-e-registro">
                            <p><a href=""><b>Já possui uma conta? Realize o login</b></a></p>
                            <p><a href="cadastro.html"><b>Não possui uma conta? Registre-se</b></a></p>
                        </div>
                    </div>
                </div>
                <!-- Botão API Google e Apple   -->
                <div class="container-api-google-e-apple">
                    <div class="button-login-google">
                        <button title="Logar com a conta Google">
                            <img src="img/icones/Logo Google.png" alt="Logo Google">
                            <b>Faça login com Google</b>
                        </button>
                    </div>
                    <div class="button-login-apple">
                        <button title="Logar com a conta Apple">
                            <img src="img/icones/Logo Apple.png" alt="Logo Apple">
                            <b>Faça login com a Apple</b>
                        </button>
                    </div>
                    <div class="button-login-apple">
                        <button title="Logar com a conta SpotLivre">
                            <img src="img/dsin-logo.png" alt="Logo Apple">
                            <b>Faça login com a Apple</b>
                        </button>
                    </div>
                </div>
            </aside>
            <aside class="imagem-carro">
                <img style="width: 100%;" src="img/background.png">
            </aside>
        </div>
    </main>
    <footer></footer>
</body>

</html>
